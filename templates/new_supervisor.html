{% extends "base.html" %}
{% block title %}New Supervisor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Add Supervisor</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Temporary Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Supervisor</button>
    </form>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-link mt-2">&larr; Back</a>
  </div>
</div>
{% endblock %}
