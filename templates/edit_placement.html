{% extends "base.html" %}
{% block title %}Placement Details{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Placement Details</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Company Name</label>
        <input type="text" name="company_name" class="form-control" value="{{ current_user.company_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Company Address</label>
        <textarea name="company_address" class="form-control" rows="2">{{ current_user.company_address or '' }}</textarea>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Start Date</label>
          <input type="date" name="start_date" class="form-control"
                 value="{{ current_user.start_date or '' }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">End Date</label>
          <input type="date" name="end_date" class="form-control"
                 value="{{ current_user.end_date or '' }}">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save</button>
    </form>
  </div>
</div>
{% endblock %}
