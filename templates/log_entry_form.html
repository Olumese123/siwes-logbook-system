{% extends "base.html" %}
{% block title %}{{ 'Edit' if entry else 'New' }} Log Entry{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h2 class="mb-4">{{ 'Edit' if entry else 'New' }} Log Entry</h2>
    <form method="POST">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Week Number</label>
          <input type="number" min="1" name="week_number" class="form-control" required
                 value="{{ entry.week_number if entry else '' }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Date</label>
          <input type="date" name="entry_date" class="form-control" required
                 value="{{ entry.entry_date if entry else '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Activities This Week</label>
        <textarea name="activities" class="form-control" rows="4" required
                  placeholder="Describe what you did this week...">{{ entry.activities if entry else '' }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Skills Learned</label>
        <textarea name="skills_learned" class="form-control" rows="3">{{ entry.skills_learned if entry else '' }}</textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="attended" id="attended"
               {% if not entry or entry.attended %}checked{% endif %}>
        <label class="form-check-label" for="attended">Present this week</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Entry</button>
    </form>
  </div>
</div>
{% endblock %}
