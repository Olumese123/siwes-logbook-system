{% extends "base.html" %}
{% block title %}Assign Supervisor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Assign Supervisor</h2>
    <p>Student: <strong>{{ student.name }}</strong></p>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Supervisor</label>
        <select name="supervisor_id" class="form-select">
          <option value="">— unassigned —</option>
          {% for sup in supervisors %}
          <option value="{{ sup.id }}" {% if student.supervisor_id == sup.id %}selected{% endif %}>{{ sup.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Save</button>
    </form>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-link mt-2">&larr; Back</a>
  </div>
</div>
{% endblock %}
